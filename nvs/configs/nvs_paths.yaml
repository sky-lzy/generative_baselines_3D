# All roots the NVS pipeline touches. paths.vwm_repo/hf_home are exported to child scripts as
# env vars (VWM_REPO / HF_HOME); an unedited nvs_paths.yaml reproduces the original evaluation
# exactly. Scene sets are DATA (read-only), preds/results are outputs (safe to point elsewhere).
paths:
  # source repo (model code, hydra configs, datasets/svc_scenes.py loader,
  # scripts/inference_single_gpu_ray_to_rgb_depth_eval.py — the campaign inference engine) -> VWM_REPO
  vwm_repo: /net/holy-isilon/ifs/rc_labs/ydu_lab/Lab/akiruga/world_model_4d/video_world_model_new
  # home-field center-50 scene sets: <scenes_root>/<ds>/<scene>/{images/, transforms.json}
  # (reconfusion format; built by vwm_repo/eval_svc/build_homefield_{dl3dv,spatialvid,mip,re10k}.py)
  scenes_root: /n/netscratch/ydu_lab/Lab/akiruga/vwm_eval_data/svc_bench/scenes_homefield
  # HuggingFace cache (Wan VAE / text-encoder weights)                                     -> HF_HOME
  hf_home: /n/netscratch/ydu_lab/Lab/akiruga
  # this codebase (auto-detected by run_nvs.py; only used for the interpolations below)
  standardized_eval: /net/holy-isilon/ifs/rc_labs/ydu_lab/Lab/akiruga/world_model_4d/standardized_eval

# where THIS module writes predictions and result CSVs.
# To re-score predictions already computed by the original campaign (skip GPU inference and go
# straight to scoring), point preds.nvs at the campaign runs dir:
#   preds.nvs: ${paths.vwm_repo}/eval_svc/hf_runs
preds:
  nvs: ${paths.standardized_eval}/nvs/preds     # <tag>__<ds>__ncf<k>/sample_XXXXX/{pred_rgb.mp4,rgb_metrics.json,...}
results:
  nvs: ${paths.standardized_eval}/nvs/results   # <tag>__<ds>__ncf<k>.csv (scene,psnr rows + AVERAGE)
